name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  artifact:
    name: release-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Package release
        shell: bash
        run: |
          mkdir release
          git archive HEAD | tar -x -C release
          rm -rf release/.data release/.codebase-memory release/.test-venv release/artifacts
          rm -f release/docker-compose.yml release/docker-compose.preview.yml release/Dockerfile.backend release/Dockerfile.rust-cli
          rm -rf release/ui/dist
          mkdir -p release/ui
          cp -R ui/dist release/ui/dist
          tar -czf "rag-llm-${GITHUB_REF_NAME}.tar.gz" release

      - uses: actions/upload-artifact@v4
        with:
          name: rag-llm-${{ github.ref_name }}
          path: rag-llm-${{ github.ref_name }}.tar.gz

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rag-llm-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
