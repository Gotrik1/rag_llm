[package]
name = "llm-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (Ollama + Qdrant API)
reqwest = { version = "0.12", features = ["json"] }

# Сериализация
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Эмбеддинги (ONNX, без Python)
fastembed = "4"

# Векторная БД
qdrant-client = "1"

# Парсинг документов
lopdf = "0.36"
docx-rs = "0.4"
pulldown-cmark = "0.13"

# Кэш ответов
rusqlite = { version = "0.32", features = ["bundled"] }

# Хэш для кэша
sha2 = "0.10"
hex = "0.4"

# Логирование
tracing = "0.1"
tracing-subscriber = "0.3"

# Обход файловой системы
walkdir = "2"

# Обработка ошибок
anyhow = "1"

# Для парсинга DOCX (zip-архив)
zip = "2"

# BM25 полнотекстовый поиск
tantivy = "0.22"
