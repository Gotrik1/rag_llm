name: rag-assistant

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-environment: &app-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-rag}
  POSTGRES_USER: ${POSTGRES_USER:-rag}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  RESPONSE_CACHE_HOST: response-cache
  RESPONSE_CACHE_PORT: "6379"
  RESPONSE_CACHE_TTL_SECONDS: ${RESPONSE_CACHE_TTL_SECONDS:-86400}
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  RAG_SECRET_KEY_FILE: /run/secrets/app_secret_key
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_docs_v10}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://llm-bridge:11434}
  LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.8-27B}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
  RAG_DATA_DIR: ${RAG_DATA_DIR:-/app/.data}
  BM25_PERSIST_DIR: ${BM25_PERSIST_DIR:-/app/.data/bm25}
  RUST_DATA_DIR: ${RUST_DATA_DIR:-/app/.data/rust}
  CACHE_DB: ${CACHE_DB:-/app/.data/cache/cache.db}
  RAG_AUTH_MODE: ${RAG_AUTH_MODE:-local}
  RAG_SESSION_COOKIE_SECURE: ${RAG_SESSION_COOKIE_SECURE:-true}
  RAG_QUERY_UNDERSTANDING: ${RAG_QUERY_UNDERSTANDING:-true}
  RAG_CORRECTIVE_PIPELINE: ${RAG_CORRECTIVE_PIPELINE:-off}
  RAG_REFERENCE_EXPANSION: ${RAG_REFERENCE_EXPANSION:-off}
  RAG_MAX_ADDITIONAL_SEARCH_ROUNDS: ${RAG_MAX_ADDITIONAL_SEARCH_ROUNDS:-2}
  RAG_EVIDENCE_MAX_CHARS: ${RAG_EVIDENCE_MAX_CHARS:-36000}
  RAG_PLANNER_THINKING: ${RAG_PLANNER_THINKING:-false}
  RAG_PLANNER_TOKEN_BUDGET: ${RAG_PLANNER_TOKEN_BUDGET:-4096}
  RAG_PLANNER_TIMEOUT_SECONDS: ${RAG_PLANNER_TIMEOUT_SECONDS:-120}
  RAG_PLANNER_BASE_URL: ${RAG_PLANNER_BASE_URL:-}
  RAG_VISION_BASE_URL: ${RAG_VISION_BASE_URL:-}
  RAG_VISION_MODEL: ${RAG_VISION_MODEL:-Qwen/Qwen3.8-27B}
  RAG_FORMULA_OCR_URL: ${RAG_FORMULA_OCR_URL:-}
  RAG_VISION_TIMEOUT_SECONDS: ${RAG_VISION_TIMEOUT_SECONDS:-180}
  RAG_RERANKER_MODE: ${RAG_RERANKER_MODE:-off}
  RAG_RERANKER_URL: ${RAG_RERANKER_URL:-http://llm-bridge:11434/api/rerank}
  RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-base}
  RAG_RERANKER_TIMEOUT_SECONDS: ${RAG_RERANKER_TIMEOUT_SECONDS:-8}
  RAG_RERANKER_CANDIDATE_LIMIT: ${RAG_RERANKER_CANDIDATE_LIMIT:-40}
  RAG_RERANKER_MODEL_WEIGHT: ${RAG_RERANKER_MODEL_WEIGHT:-0.75}
  RAG_SESSION_LIFETIME_HOURS: ${RAG_SESSION_LIFETIME_HOURS:-168}
  RAG_LOGIN_LOCK_MINUTES: ${RAG_LOGIN_LOCK_MINUTES:-15}
  RAG_LOCAL_ADMIN_EMAILS: ${RAG_LOCAL_ADMIN_EMAILS:-}
  RAG_ALL_USERS_MANAGE_GLOBAL_DOCUMENTS: ${RAG_ALL_USERS_MANAGE_GLOBAL_DOCUMENTS:-true}
  RAG_OIDC_ISSUER: ${RAG_OIDC_ISSUER:-}
  RAG_OIDC_AUDIENCE: ${RAG_OIDC_AUDIENCE:-}
  RAG_OIDC_JWKS_URL: ${RAG_OIDC_JWKS_URL:-}
  RAG_OIDC_ROLE_CLAIM: ${RAG_OIDC_ROLE_CLAIM:-roles}
  RAG_OIDC_PERMISSION_CLAIM: ${RAG_OIDC_PERMISSION_CLAIM:-permissions}
  RAG_CORS_ORIGINS: ${CORS_ALLOW_ORIGIN:-http://localhost:8080}
  RAG_REDIS_REQUIRED: "true"
  RAG_DURABLE_GENERATION: ${RAG_DURABLE_GENERATION:-true}
  RAG_INGESTION_QUEUE_NAME: ${RAG_INGESTION_QUEUE_NAME:-arq:queue:ingestion}
  RAG_GENERATION_QUEUE_NAME: ${RAG_GENERATION_QUEUE_NAME:-arq:queue:generation}
  RAG_GENERATION_WAIT_SECONDS: ${RAG_GENERATION_WAIT_SECONDS:-900}
  RAG_AUDIT_RETENTION_DAYS: ${RAG_AUDIT_RETENTION_DAYS:-365}
  BOOTSTRAP_SUPERADMIN_SUBJECT: ${BOOTSTRAP_SUPERADMIN_SUBJECT:-rag-superadmin}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=rag,deployment.environment=production
  RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}

x-app-secrets: &app-secrets
  - postgres_password
  - redis_password
  - app_secret_key

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: rag-service:${RAG_IMAGE_TAG:-local}
  environment: *app-environment
  secrets: *app-secrets
  networks:
    - backend
    - egress
  security_opt:
    - no-new-privileges:true
  logging: *common-logging

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
    secrets:
      - postgres_password
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/postgres:/var/lib/postgresql/data:Z
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  redis:
    image: redis:8.8.0-alpine
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory "${REDIS_MAXMEMORY:-2gb}" --maxmemory-policy noeviction
    secrets:
      - redis_password
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/redis:/data:Z
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  response-cache:
    image: redis:8.8.0-alpine
    command:
      - /bin/sh
      - -ec
      - exec redis-server --save "" --appendonly no --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory "${RESPONSE_CACHE_MAXMEMORY:-256mb}" --maxmemory-policy allkeys-lfu
    secrets:
      - redis_password
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  qdrant:
    image: qdrant/qdrant:v1.17.1
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/qdrant:/qdrant/storage:Z
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  migrate:
    <<: *app-base
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-base
    command: ["api"]
    environment:
      <<: *app-environment
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/app:/app/.data:z
      - ${RAG_DATA_ROOT:-./.data/storage}/model-cache:/app/.fastembed_cache:z
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-bridge:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ingestion-worker:
    <<: *app-base
    command: ["worker"]
    environment:
      <<: *app-environment
      RAG_WORKER_CONCURRENCY: ${RAG_WORKER_CONCURRENCY:-1}
      RAG_INGESTION_EMBED_URL: ${RAG_INGESTION_EMBED_URL:-}
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/app:/app/.data:z
      - ${RAG_DATA_ROOT:-./.data/storage}/model-cache:/app/.fastembed_cache:z
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      response-cache:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  audit-retention:
    image: postgres:17.5-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/audit-retention"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      AUDIT_RETENTION_DAYS: ${RAG_AUDIT_RETENTION_DAYS:-365}
      AUDIT_RETENTION_INTERVAL_SECONDS: ${AUDIT_RETENTION_INTERVAL_SECONDS:-86400}
    secrets:
      - postgres_password
    volumes:
      - ./deploy/postgres/audit-retention.sh:/usr/local/bin/audit-retention:ro
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  proxy:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: rag-proxy:${RAG_IMAGE_TAG:-local}
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:8080}
      NGINX_ENVSUBST_FILTER: CORS_ALLOW_ORIGIN
    ports:
      - 127.0.0.1:${RAG_HTTP_PORT:-8080}:8080
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /tmp:uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  generation-worker:
    <<: *app-base
    command: ["generation-worker"]
    environment:
      <<: *app-environment
      RAG_GENERATION_CONCURRENCY: ${RAG_GENERATION_CONCURRENCY:-4}
      RAG_GENERATION_TIMEOUT_SECONDS: ${RAG_GENERATION_TIMEOUT_SECONDS:-1800}
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/app:/app/.data:z
      - ${RAG_DATA_ROOT:-./.data/storage}/model-cache:/app/.fastembed_cache:z
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      response-cache:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-bridge:
        condition: service_healthy
    restart: unless-stopped

  tls-proxy:
    image: nginx:1.28-alpine
    environment:
      NGINX_ENVSUBST_FILTER: RAG_SERVER_NAME
      RAG_SERVER_NAME: ${RAG_SERVER_NAME:-iprg001}
    volumes:
      - ./deploy/nginx/tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_FILE:-./deploy/certs/rag.crt}:/etc/nginx/tls/rag.crt:ro
      - ${TLS_KEY_FILE:-./deploy/certs/rag.key}:/etc/nginx/tls/rag.key:ro
    ports:
      - ${RAG_HTTPS_BIND_ADDRESS:-0.0.0.0}:${RAG_HTTPS_PORT:-8443}:8443
    networks:
      - frontend
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --no-check-certificate --spider https://127.0.0.1:8443/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - backend
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - ${RAG_DATA_ROOT:-./.data/storage}/prometheus:/prometheus:Z
    networks:
      - backend
    depends_on:
      - app
      - otel-collector
      - postgres-exporter
      - redis-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-rag}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-rag}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_exporter_passwords
    secrets:
      - redis_exporter_passwords
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ${RAG_DATA_ROOT:-./.data/storage}/tempo:/var/tempo:Z
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ${RAG_DATA_ROOT:-./.data/storage}/loki:/loki:Z
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  alloy:
    image: grafana/alloy:v1.16.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${RAG_DATA_ROOT:-./.data/storage}/alloy:/var/lib/alloy:Z
    networks:
      - backend
    depends_on:
      - loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_UNIFIED_ALERTING_ENABLED: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${RAG_DATA_ROOT:-./.data/storage}/grafana:/var/lib/grafana:Z
    ports:
      - ${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000
    networks:
      - backend
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  vllm:
    image: vllm/vllm-openai:v0.17.0
    command:
      - ${VLLM_MODEL:-Qwen/Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --dtype
      - bfloat16
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-32768}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-5}"
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}"
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    gpus: all
    ipc: host
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/models:/root/.cache/huggingface:Z
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  document-vision:
    profiles: ["document-vision"]
    build:
      context: .
      dockerfile: deploy/document-vision/Dockerfile
    image: rag-document-vision:${RAG_VISION_IMAGE_TAG:-latest}
    user: "10001:10001"
    environment:
      HF_HOME: /data/models
      HF_HUB_OFFLINE: "1"
      VISION_GPU_MEMORY_FRACTION: ${VISION_GPU_MEMORY_FRACTION:-0.065}
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/vision-models:/data/models:ro,z
    networks: [backend]
    mem_limit: 12g
    cpus: 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=30)"]
      interval: 30s
      timeout: 35s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    logging: *common-logging

  index-embedding:
    profiles: ["ingestion-gpu"]
    build:
      context: .
      dockerfile: deploy/index-embedding/Dockerfile
    image: rag-index-embedding:${RAG_EMBED_GPU_IMAGE_TAG:-836314277}
    user: "10001:10001"
    environment:
      FASTEMBED_MODEL: ${FASTEMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      FASTEMBED_GPU_MEMORY_LIMIT: "4294967296"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/embeddings:/data/fastembed:ro,z
    networks: [backend]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *common-logging

  llm-bridge:
    build:
      context: .
      dockerfile: deploy/llm-bridge/Dockerfile
    image: rag-llm-bridge:${RAG_IMAGE_TAG:-local}
    environment:
      VLLM_BASE_URL: http://vllm:8000
      LLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3.8-27B}
      FASTEMBED_MODEL: ${FASTEMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      FASTEMBED_CACHE_PATH: /data/fastembed
      RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-base}
      RERANKER_CACHE_PATH: /data/fastembed
      RERANKER_MAX_DOCUMENTS: ${RAG_RERANKER_CANDIDATE_LIMIT:-40}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-900}
      RAG_ALLOW_PLANNER_THINKING: ${RAG_ALLOW_PLANNER_THINKING:-false}
    volumes:
      - ${RAG_DATA_ROOT:-./.data/storage}/embeddings:/data/fastembed:Z
    networks:
      - backend
      - egress
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

networks:
  frontend:
  egress:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  app_data:
  model_cache:
  prometheus_data:
  tempo_data:
  loki_data:
  alloy_data:
  grafana_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./deploy/secrets/postgres_password}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-./deploy/secrets/redis_password}
  redis_exporter_passwords:
    file: ${REDIS_EXPORTER_PASSWORD_FILE:-./deploy/secrets/redis_exporter_passwords.json}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./deploy/secrets/grafana_admin_password}
  app_secret_key:
    file: ${APP_SECRET_KEY_FILE:-./deploy/secrets/app_secret_key}
