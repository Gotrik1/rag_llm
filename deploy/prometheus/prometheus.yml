global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: production
    service: rag

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: [app:8000]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: [qdrant:6333]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
