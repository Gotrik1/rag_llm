groups:
  - name: rag-availability
    rules:
      - alert: RagApiUnavailable
        expr: up{job="rag-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: rag-api
        annotations:
          summary: RAG API is unavailable
          description: Prometheus has been unable to scrape the RAG API for two minutes.

      - alert: RagDependencyUnavailable
        expr: up{job=~"qdrant|postgres|redis"} == 0
        for: 5m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: RAG dependency is unavailable
          description: "{{ $labels.job }} has been unavailable for five minutes."

      - alert: RagHighHttpErrorRate
        expr: |
          sum(rate(rag_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(rag_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
          service: rag-api
        annotations:
          summary: RAG API 5xx rate is above 5 percent
          description: More than 5 percent of RAG API responses have failed for ten minutes.

      - alert: RagHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(rag_http_request_duration_seconds_bucket[10m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          service: rag-api
        annotations:
          summary: RAG API p95 latency is above 10 seconds
          description: The p95 request latency has remained above ten seconds for ten minutes.

      - alert: RagAuthorizationDenialSpike
        expr: |
          sum(rate(rag_authorization_decisions_total{result=~"deny|unauthenticated"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: rag-auth
        annotations:
          summary: Authorization denials are elevated
          description: The service is rejecting more than 0.5 requests per second.

      - alert: RagOtelCollectorNotScraped
        expr: up{job="otel-collector"} == 0
        for: 5m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: OpenTelemetry Collector metrics are unavailable
          description: Span-derived metrics are unavailable in Prometheus.
