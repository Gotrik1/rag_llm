server {
    listen 80;
    server_name _;

    # The default is 1 MiB, which rejects normal batches of documents before
    # they reach the ingestion API.
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker can assign a new IP address when the backend is recreated.
        # Resolve the service name at request time so a frontend container that
        # stays up never keeps forwarding requests to a stale backend IP.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
